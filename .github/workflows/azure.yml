name: CI y despliegue en Azure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Pruebas y paquete
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QN_OFFLINE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-dev.txt
      - name: Recuperar originales MOLA
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            data/official_kickoff/raw/mola/megt44n000hb.img
            data/official_kickoff/raw/mola/megt44n000hb.lbl
          key: mola-${{ hashFiles('data/official_kickoff/manifest.json') }}
      - name: Verificar y preparar el terreno MOLA
        run: python -X utf8 -c 'from scripts.start import prepare_terrain; prepare_terrain()'
      - run: python -m pytest
      - run: node --test tests/*.test.mjs
      - name: Empaquetar la app con el terreno procesado
        if: github.ref == 'refs/heads/main' && github.repository == 'duermes/qhapac-nan'
        run: |
          git archive --format=zip --output=qhapaq-nan.zip HEAD -- \
            api khipu khipu_data web requirements.txt \
            data/fixtures data/official_science data/official_kickoff/manifest.json
          zip -qr qhapaq-nan.zip data/processed/generated/regions
          unzip -tq qhapaq-nan.zip
      - name: Guardar el paquete de despliegue
        if: github.ref == 'refs/heads/main' && github.repository == 'duermes/qhapac-nan'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qhapaq-nan
          path: qhapaq-nan.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  deploy:
    name: Desplegar y verificar en Azure
    if: github.ref == 'refs/heads/main' && github.repository == 'duermes/qhapac-nan'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: qhapaq-nan
      - name: Iniciar sesión en Azure con OIDC
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: c46b9809-d161-4788-a5ad-9268f6a55df2
          tenant-id: c4a66c34-2bb7-451f-8be1-b2c26a430158
          subscription-id: 7a6442b6-cec7-45eb-a8f1-2f5e1395053c
      - name: Publicar en Azure App Service
        run: |
          az webapp deploy \
            --resource-group rg-qhapac-nan \
            --name qhapac-nan-jezero \
            --src-path qhapaq-nan.zip \
            --type zip --timeout 600000 --only-show-errors --output none
      - name: Verificar el portal y el terreno
        run: |
          base="https://qhapac-nan-jezero.azurewebsites.net"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 15 --retry-max-time 120 "$base/api/health" |
            python3 -c 'import json, sys; health=json.load(sys.stdin); assert health["status"] == "ok" and health["data"]["macro_available"]'
          curl --fail --silent --show-error --max-time 20 \
            "$base/api/terrain/syrtis_jezero_nili?include_grid=true&stride=16" |
            python3 -c 'import json, sys; terrain=json.load(sys.stdin); assert terrain["available"] and terrain["elevation"]'
          curl --fail --silent --show-error --max-time 20 "$base/home" --output /dev/null
