<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <style>
    .runner { animation: stride .65s ease-in-out infinite; transform-origin: 120px 80px; }
    .front { animation: swing .65s ease-in-out infinite; }
    .back { animation: swing .65s ease-in-out -.325s infinite; }
    .knee-front { animation: bend .65s ease-in-out infinite; }
    .knee-back { animation: bend .65s ease-in-out -.325s infinite; }
    .cape { animation: cloth .65s ease-in-out infinite; transform-origin: 110px 48px; }
    .trail { stroke-dasharray: 15 12 3 12; animation: trail .65s linear infinite; }
    @keyframes swing { 0%,100% { transform: rotate(-35deg); } 50% { transform: rotate(38deg); } }
    @keyframes bend { 0%,100% { transform: rotate(20deg); } 50% { transform: rotate(85deg); } }
    @keyframes stride { 0%,50%,100% { transform: translateY(0) rotate(4deg); } 25%,75% { transform: translateY(-4px) rotate(4deg); } }
    @keyframes cloth { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(5deg); } }
    @keyframes trail { to { stroke-dashoffset: 42; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <ellipse cx="118" cy="140" rx="44" ry="3" fill="#dfbd80" opacity=".12"/>
